services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
  app:
    image: golang:1.25-alpine
    working_dir: /src
    volumes:
      - ./:/src
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      HTTP_ADDR: ":8080"
      GOTOOLCHAIN: auto
      GOPROXY: https://proxy.golang.org,direct
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_DB: app
    command: sh -c "go mod download && go run ."
    expose:
      - "8080"
    depends_on:
      - mysql

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    command: ["/bin/sh","-c","cat >/etc/nginx/conf.d/default.conf << 'EOF'\nserver {\n  listen 80;\n  location / {\n    proxy_pass http://app:8080;\n    proxy_set_header Host $$host;\n    proxy_set_header X-Real-IP $$remote_addr;\n    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $$scheme;\n  }\n}\nEOF\nnginx -g 'daemon off;'"]

volumes:
  mysql_data: